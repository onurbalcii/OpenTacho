<!doctype html>
<html lang="tr" data-theme="vangogh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1230">
<title>OpenTacho</title>
<style>
  /* OpenTacho — LAN ikinci ekran (telefon / tablet). Aynı ağdaki bilgisayardaki uygulamadan saniyede bir durum çeker. */
  :root {
    --gold: #fdca4f; --gold-line: rgba(253,202,79,.78); --gold-soft: rgba(253,202,79,.16);
    --sky: #7cc0ef; --duty: #f3b979; --yard: #cdb0ff; --bad: #ff6b6b; --warn: #ffa94d;
    --text: #f6efdc; --muted: rgba(246,239,220,.72); --dim: rgba(246,239,220,.42);
    --bg: linear-gradient(160deg, #162668, #080e2e); --panel: rgba(3,8,30,.45); --line: rgba(255,255,255,.12); --track: rgba(3,8,30,.65);
    --display: "Segoe UI Variable Display", "Bahnschrift", "Segoe UI", system-ui, -apple-system, sans-serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  html[data-theme="dark"] { --gold: #7aa7ff; --gold-line: rgba(122,167,255,.55); --gold-soft: rgba(122,167,255,.16); --sky: #6fd3c7; --duty: #f0b56b; --yard: #c9a2ff;
    --text: #e9edf5; --muted: rgba(233,237,245,.7); --dim: rgba(233,237,245,.4); --bg: #171b22; --panel: #0f1216; --line: rgba(255,255,255,.12); --track: #0b0e12; }
  html[data-theme="light"] { --gold: #2b5fd9; --gold-line: rgba(43,95,217,.45); --gold-soft: rgba(43,95,217,.12); --sky: #0f8f83; --duty: #c2680a; --yard: #7a48d6; --bad: #d63b3b; --warn: #d97a06;
    --text: #1b1f2a; --muted: rgba(27,31,42,.68); --dim: rgba(27,31,42,.38); --bg: #eef1f6; --panel: #ffffff; --line: #d9dee8; --track: #e3e7ef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--sans); color: var(--text); background: var(--bg); background-attachment: fixed; padding: max(10px, env(safe-area-inset-top)) 12px calc(64px + env(safe-area-inset-bottom)); -webkit-user-select: none; user-select: none; }
  svg { display: block; } .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -.15em; }
  .ic svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; backdrop-filter: blur(6px); }
  /* üst */
  .top { display: flex; align-items: center; gap: 10px; }
  .top .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .top .dot.ok { background: var(--sky); box-shadow: 0 0 8px var(--sky); } .top .dot.bad { background: var(--bad); }
  .top .name { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .name b { color: var(--text); font-weight: 600; }
  .top .clock { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .top .clock small { font-size: 11px; color: var(--dim); margin-left: 4px; font-weight: 400; }
  .top .snd { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; font-size: 16px; }
  .top .snd.on { color: var(--gold); border-color: var(--gold-line); }
  /* ana gösterge */
  .hero { text-align: center; padding: 16px 12px 12px; }
  .chip { display: inline-block; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--tone, var(--gold)); color: var(--tone, var(--gold)); font-size: 11px; letter-spacing: 1px; font-weight: 700; }
  .hero .lbl { margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: .5px; }
  .hero .val { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; margin: 4px 0; color: var(--tone, var(--gold)); font-variant-numeric: tabular-nums; }
  .hero .sub { font-size: 13px; color: var(--muted); }
  .hero.warn { --tone: var(--warn); } .hero.bad { --tone: var(--bad); } .hero.rest { --tone: var(--sky); } .hero.idle { --tone: var(--muted); }
  .hero.bad .val { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .flags { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; font-size: 11px; color: var(--dim); }
  .flags span { display: inline-flex; align-items: center; gap: 4px; } .flags .ic { color: var(--gold); }
  .flags span.warn { color: var(--warn); } .flags span.bad { color: var(--bad); }
  /* çubuklar */
  .bar { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; color: var(--muted); }
  .bar .ic { color: var(--gold); font-size: 16px; }
  .bar .name { grid-column: 2; } .bar .v { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; white-space: nowrap; }
  .bar .track { grid-column: 2 / 4; position: relative; height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--sky)); transition: width .4s; }
  .bar .fill.rest { background: linear-gradient(90deg, var(--sky), var(--gold)); } .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
  .bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .55; }
  .bar small.ext { grid-column: 3; color: var(--warn); font-size: 10.5px; text-align: right; }
  .wline { font-size: 11.5px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; padding-top: 4px; } .wline b { color: var(--text); }
  .wline .bad { color: var(--bad); } .wline .warn { color: var(--warn); }
  /* akış */
  .seq { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; } .seq::-webkit-scrollbar { display: none; }
  .box { flex: none; min-width: 74px; border-radius: 12px; border: 1px solid var(--line); background: var(--track); padding: 8px 6px; text-align: center; opacity: .55; }
  .box.active { opacity: 1; border-color: var(--gold-line); background: var(--gold-soft); } .box.done { opacity: .8; } .box.part { opacity: .9; }
  .box b { display: block; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; } .box small { font-size: 10px; color: var(--muted); }
  .box .ic { font-size: 16px; color: var(--gold); display: block; margin: 2px auto 0; }
  /* iş */
  .job { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; } .job b { color: var(--text); font-weight: 600; }
  .job .eta { font-family: var(--display); font-weight: 600; } .job .eta.ok { color: var(--sky); } .job .eta.warn { color: var(--warn); } .job .eta.bad { color: var(--bad); }
  /* eylemler */
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .act { border: 1px solid var(--line); background: var(--track); color: var(--text); border-radius: 14px; padding: 12px 8px; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
  .act .ic { font-size: 18px; color: var(--gold); } .act small { display: block; font-size: 10.5px; color: var(--dim); font-weight: 400; }
  .act.on { background: var(--gold-soft); border-color: var(--gold-line); } .act.sky.on { border-color: var(--sky); } .act.sky.on .ic { color: var(--sky); }
  .act:disabled { opacity: .35; } .act.wide { grid-column: 1 / -1; }
  .note { font-size: 11.5px; color: var(--dim); text-align: center; margin-top: 8px; }
  /* günlük */
  .log { font-size: 12px; color: var(--muted); display: grid; gap: 4px; } .log div { display: flex; gap: 8px; } .log b { font-family: var(--display); color: var(--dim); font-weight: 500; flex: none; }
  h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  /* sekmeler */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(10px); z-index: 5; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 11px; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px; }
  .tabs button .ic { font-size: 20px; } .tabs button.on { color: var(--gold); }
  .page[hidden] { display: none; }
  /* geçmiş / plan */
  .hday, .hweek, .hjob, .pcard { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; background: var(--track); }
  .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; } .hd b { color: var(--gold); } .hd span { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .hstats { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 5px; } .hstats b { color: var(--text); font-family: var(--display); }
  .hstats .bad, .hstats .bad b { color: var(--bad); } .hstats .ok { color: var(--sky); } .hstats .fine b { color: var(--warn); }
  .hviol { font-size: 11.5px; color: var(--bad); margin-top: 4px; }
  .hsub { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .4px; margin: 10px 0 6px; }
  .pin { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .pin label { display: grid; gap: 4px; font-size: 11px; color: var(--dim); }
  .pin input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--track); color: var(--text); font: inherit; font-size: 15px; -moz-appearance: textfield; }
  .pin input::-webkit-outer-spin-button, .pin input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .pcard.now { border-color: var(--gold-line); } .pcard .big { font-family: var(--display); font-size: 24px; font-weight: 700; } .pcard .big small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 6px; }
  .pcard .steps { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 11.5px; color: var(--muted); margin-top: 4px; } .pcard .steps span { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .verdict { font-family: var(--display); font-weight: 700; font-size: 13px; } .verdict.ok { color: var(--sky); } .verdict.warn { color: var(--warn); } .verdict.bad { color: var(--bad); }
  .sm { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; }
  /* kapaklar */
  .cover { position: fixed; inset: 0; background: rgba(4,8,30,.82); display: grid; place-items: center; z-index: 20; text-align: center; padding: 24px; color: #f6efdc; }
  .cover[hidden] { display: none; } .cover h2 { font-family: var(--display); margin: 0 0 8px; } .cover p { color: rgba(246,239,220,.75); margin: 0 0 18px; font-size: 14px; }
  .cover .btn { border: 1px solid var(--gold-line); background: var(--gold-soft); color: #f6efdc; border-radius: 999px; padding: 14px 28px; font: inherit; font-size: 16px; font-weight: 600; }
  .cover img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 8px; }
  @media (min-width: 720px) { body { padding-left: 24px; padding-right: 24px; } .wrap { max-width: 960px; margin: 0 auto; }
    #pageMain { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; align-items: start; grid-auto-flow: row dense; }
    #pageMain > .card:nth-child(-n+3) { grid-column: 1; } #pageMain > .card:nth-child(n+4) { grid-column: 2; }
    .hero .val { font-size: 84px; } .acts { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="cover" class="cover"><div><img id="coverLogo" alt=""><h2>OpenTacho</h2><p id="coverText">Dokun ve başla</p><button class="btn" id="coverBtn">▶</button></div></div>
<div id="offline" class="cover" hidden><div><h2>OpenTacho</h2><p id="offlineText">Bağlantı yok — yeniden deneniyor…</p></div></div>
<video id="nosleep" playsinline muted loop style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<div class="card top">
  <div class="dot" id="dot"></div>
  <div class="name" id="name">OpenTacho</div>
  <div class="clock"><span id="clockT">--:--</span><small id="clockD"></small></div>
  <button class="snd" id="sndBtn" title="">🔔</button>
</div>

<div class="wrap">
<div class="page" id="pageMain">
  <div class="card hero" id="hero">
    <span class="chip" id="chip">—</span>
    <div class="lbl" id="bigLabel"></div>
    <div class="val" id="bigVal">--:--</div>
    <div class="sub" id="bigSub"></div>
    <div class="flags" id="flags"></div>
  </div>
  <div class="card">
    <div class="bar" id="bBlock"><i class="ic" data-ic="wheel"></i><span class="name"></span><span class="v"></span><div class="track"><div class="fill"></div></div></div>
    <div class="bar" id="bDaily"><i class="ic" data-ic="road"></i><span class="name"></span><span class="v"></span><div class="track"><div class="fill"></div><div class="mark"></div></div><small class="ext" hidden></small></div>
    <div class="bar" id="bRest"><i class="ic" data-ic="bed"></i><span class="name"></span><span class="v"></span><div class="track"><div class="fill rest"></div><div class="mark" hidden></div></div></div>
    <div class="bar" id="bWeek" hidden><i class="ic" data-ic="calendar"></i><span class="name"></span><span class="v"></span><div class="track"><div class="fill"></div></div></div>
    <div class="wline" id="wline" hidden></div>
  </div>
  <div class="card"><div class="seq" id="seq"></div></div>
  <div class="card" id="jobCard" hidden><div class="job" id="job"></div></div>
  <div class="card">
    <div class="acts">
      <button class="act sky" id="aBreak"><i class="ic" data-ic="cup"></i><span></span></button>
      <button class="act" id="aYard"><i class="ic" data-ic="yard"></i><span></span></button>
      <button class="act" id="aSkip"><i class="ic" data-ic="skip"></i><span></span></button>
      <button class="act" id="aFull"><i class="ic" data-ic="bed"></i><span></span></button>
      <button class="act wide" id="aWeek" hidden><i class="ic" data-ic="calendar"></i><span></span></button>
    </div>
    <div class="note" id="actNote" hidden></div>
  </div>
  <div class="card"><h4 id="logTitle"></h4><div class="log" id="log"></div></div>
</div>

<div class="page span" id="pageHist" hidden><div class="card" id="hist"></div></div>

<div class="page span" id="pagePlan" hidden>
  <div class="card">
    <div class="pin">
      <label><span id="lKm"></span><input type="number" id="pKm" inputmode="numeric" placeholder="1250" min="0"></label>
      <label><span id="lHours"></span><input type="number" id="pHours" inputmode="decimal" placeholder="28" min="0" step="0.5"></label>
      <label><span id="lFerry"></span><input type="number" id="pFerry" inputmode="decimal" placeholder="0" min="0" step="0.5"></label>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span id="pSrc" style="font-size:12px;color:var(--muted)"></span><button class="sm" id="pReset"></button></div>
  </div>
  <div id="plan"></div>
</div>
</div>

<div class="tabs">
  <button id="tabMain" class="on"><i class="ic" data-ic="wheel"></i><span></span></button>
  <button id="tabHist"><i class="ic" data-ic="history"></i><span></span></button>
  <button id="tabPlan"><i class="ic" data-ic="route"></i><span></span></button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = new URLSearchParams(location.search).get("k") || "";
  const SVG = (inner, vb = "0 0 24 24") => `<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
  const ICONS = {
    wheel: SVG(`<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M4.3 16.4l5.1-2.9M19.7 16.4l-5.1-2.9"/><path d="M3.3 10.5c2.6 1.1 5.5 1.7 8.7 1.7s6.1-.6 8.7-1.7" opacity=".55"/>`),
    cup: SVG(`<path d="M5 9.5h11v5.5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 5 15z"/><path d="M16 11h1.6a2.4 2.4 0 0 1 0 4.8H16"/><path d="M8.2 3.2c-.6 1 .8 1.6 0 3M11.2 3.2c-.6 1 .8 1.6 0 3" opacity=".8"/><path d="M4 21.5h13" opacity=".6"/>`),
    moon: SVG(`<path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.3 6.3 0 0 0 10.1 10.1z"/><path d="M18.5 3.5l.55 1.45L20.5 5.5l-1.45.55L18.5 7.5l-.55-1.45L16.5 5.5l1.45-.55z" fill="currentColor" stroke="none" opacity=".9"/>`),
    bed: SVG(`<path d="M3 19V7"/><path d="M3 12.5h18V19"/><path d="M3 16h18"/><path d="M7 12.5V10a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 13 10v2.5"/><path d="M21 19v-2" opacity=".6"/>`),
    road: SVG(`<path d="M8.5 3.5L4.5 20.5M15.5 3.5l4 17"/><path d="M12 4.5v2.5M12 10.5v3M12 17v3.5"/>`),
    clock: SVG(`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>`),
    user: SVG(`<circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.5c1.3-3.4 3.8-5 7-5s5.7 1.6 7 5"/>`),
    route: SVG(`<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.3 17H13a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h4.7"/>`),
    engine: SVG(`<path d="M12 3.5v7"/><path d="M7.2 6.2a7 7 0 1 0 9.6 0"/>`),
    calendar: SVG(`<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3M13 14h3" opacity=".6"/>`),
    yard: SVG(`<path d="M2.5 7.5h10v8h-10z"/><path d="M12.5 10.5h3.6l2.9 3v2h-6.5z"/><circle cx="6" cy="17.6" r="1.7"/><circle cx="15.5" cy="17.6" r="1.7"/><path d="M17 5h4.5m0 0l-1.8-1.8M21.5 5l-1.8 1.8"/>`),
    doc: SVG(`<path d="M7 3h7.5L19 7.5V21H7z"/><path d="M14.5 3v4.5H19"/><path d="M10 12h6M10 15.5h6M10 19h3.5"/>`),
    gear: SVG(`<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>`),
    skip: SVG(`<path d="M4 5.5l8 6.5-8 6.5zM12.5 5.5l8 6.5-8 6.5z" fill="currentColor" stroke="none"/>`),
    nojob: SVG(`<path d="M3.5 8.5h17v11h-17z"/><path d="M9 8.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v2.5"/><path d="M4 4l16 16" opacity=".9"/>`),
    check: SVG(`<path d="M5 12.5l4.5 4.5L19 7.5"/>`),
    parked: SVG(`<rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M9.6 16.5v-9h3.2a2.6 2.6 0 0 1 0 5.2H9.6"/>`),
    "timer-off": SVG(`<circle cx="12" cy="12" r="8.5"/><path d="M10 9v6M14 9v6"/>`),
    pause: SVG(`<rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M10 9v6M14 9v6"/>`),
    bell: SVG(`<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 3.5v1.5"/>`),
    strip: SVG(`<rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><path d="M6.5 12h5M15 12h2.5"/>`),
    image: SVG(`<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5.2-5.2L7 19.5"/>`),
    download: SVG(`<path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 19.5h15"/>`),

    if (weeks.length) { out.push(`<div class="hsub">${T("ui.hist.weeks")}</div>`);
      weeks.forEach(w => { const title = w.ago === 0 ? T("ui.hist.week_this") : w.ago === 1 ? T("ui.hist.week_last") : T("ui.hist.week_ago", { n: w.ago });
        out.push(`<div class="hweek"><div class="hd"><b>${title}</b><span>${T("ui.hist.wdays", { n: w.days })}</span></div><div class="hstats"><span><b>${hm(w.drive)}</b>${w.limit ? " / " + hm(w.limit) : ""}</span>${w.violations ? `<span class="bad"><b>${w.violations}</b> ${T("ui.hist.viol")}</span>` : `<span class="ok">${T("ui.hist.ok")}</span>`}${w.fines ? `<span class="fine">${T("ui.hist.fines")} <b>≈ ${w.fines} €</b></span>` : ""}</div></div>`); });
      out.push(`<div class="hsub">${T("ui.hist.days")}</div>`); }
    const td = h.today || {};
    if (td.drive > 0 || (td.segments || []).length) out.push(dayCard(td, T("ui.hist.today"), true));
    (h.days || []).forEach((d, i) => out.push(dayCard(d, T("ui.hist.day", { n: h.days.length - i }), false)));
    const jobs = h.jobs || [];
    if (h.cur_job || jobs.length) { out.push(`<div class="hsub">${T("ui.hist.jobs")}</div>`); if (h.cur_job) out.push(jobCard(h.cur_job, true)); jobs.forEach(j => out.push(jobCard(j, false))); }
    $("hist").innerHTML = out.join("") || `<div class="note">${T("ui.hist.none")}</div>`;
  }

  // ---- planlayıcı ----
  function planCard(p, title, cur) {
    const steps = [`<span>${T("plan.drive", { d: hm(p.drive) })}</span>`];
    if (p.breaks) steps.push(`<span>${T("plan.breaks", { n: p.breaks })}</span>`); if (p.rests) steps.push(`<span>${T("plan.rests", { n: p.rests })}</span>`);
    if (p.wrests) steps.push(`<span>${T("plan.wrests", { n: p.wrests })}</span>`); if (p.ferry) steps.push(`<span>${T(cur && cur.ferry_est ? "plan.ferry_est" : "plan.ferry", { d: hm(p.ferry) })}</span>`);
    let verdict = ""; if (p.margin != null) { const m = p.margin, cls = m < 0 ? "bad" : m < 30 ? "warn" : "ok"; verdict = `<span class="verdict ${cls}">${m < 0 ? T("plan.late", { d: hm(-m) }) : T("plan.fits", { d: hm(m) })}</span>`; }
    const eta = cur && cur.eta_local != null ? `<small>${T("plan.eta", { t: fmtAbs(cur.eta_local) })}</small>` : "";
    return `<div class="pcard${cur ? " now" : ""}"><div class="hd"><b>${title}</b>${verdict}</div><div class="big">${hm(p.total)}${eta}</div><div class="steps">${steps.join("")}</div></div>`;
  }
  let planTimer = null;
  async function renderPlan() {
    const km = parseFloat($("pKm").value), hrs = parseFloat($("pHours").value), fe = parseFloat($("pFerry").value);
    const q = [];
    if (isFinite(km) && km > 0) q.push("km=" + km); if (isFinite(hrs) && hrs > 0) q.push("hours=" + hrs); if (isFinite(fe) && fe > 0) q.push("ferry=" + fe);
    let r; try { r = await api("/plan" + (q.length ? "?" + q.join("&") : "")); } catch (e) { return; }
    const spd = r.learned ? T("plan.speed_learned", { v: r.avg_kmh }) : T("plan.speed_default", { v: r.avg_kmh });
    if (!r.available) { $("pSrc").textContent = T("plan.src_none"); $("plan").innerHTML = `<div class="note">${T("plan.empty")}<br>${spd}</div>`; return; }
    $("pSrc").textContent = (r.src === "route" ? T("plan.src_route", { d: hm(r.drive) }) : T("plan.src_manual", { d: hm(r.drive) })) + (r.deadline != null ? ` · ${T("plan.deadline", { d: hm(r.deadline) })}` : "");
    const out = [planCard(r.now, T("plan.now"), r)]; if (r.rest_first) out.push(planCard(r.rest_first, T("plan.rest_first"), null));
    out.push(`<div class="note">${spd}${r.deadline == null ? "<br>" + T("plan.no_deadline") : ""}${r.ferry_est ? "<br>" + T("plan.ferry_note") : ""}</div>`);
    $("plan").innerHTML = out.join("");
  }
  ["pKm", "pHours", "pFerry"].forEach(id => $(id).addEventListener("input", () => { clearTimeout(planTimer); planTimer = setTimeout(renderPlan, 300); }));
  $("pReset").addEventListener("click", () => { ["pKm", "pHours", "pFerry"].forEach(id => { $(id).value = ""; }); renderPlan(); });

  // ---- sekmeler ----
  let page = "main", histTimer = null, planTimer2 = null;
  function show(p) {
    page = p; ["Main", "Hist", "Plan"].forEach(n => { $("page" + n).hidden = p !== n.toLowerCase(); $("tab" + n).classList.toggle("on", p === n.toLowerCase()); });
    clearInterval(histTimer); clearInterval(planTimer2);
    if (p === "hist") { renderHist(); histTimer = setInterval(renderHist, 5000); }
    if (p === "plan") { renderPlan(); planTimer2 = setInterval(renderPlan, 3000); }
    window.scrollTo(0, 0);
  }
  $("tabMain").addEventListener("click", () => show("main")); $("tabHist").addEventListener("click", () => show("hist")); $("tabPlan").addEventListener("click", () => show("plan"));

  // ---- eylem düğmeleri ----
  $("aBreak").addEventListener("click", () => act("set_status", last && last.status === "OFF_DUTY" ? "ON_DUTY" : "OFF_DUTY"));
  $("aYard").addEventListener("click", () => act("set_status", last && last.status === "YARD_MOVE" ? "ON_DUTY" : "YARD_MOVE"));
  $("aSkip").addEventListener("click", () => { const sk = last && last.skip; if (sk && confirm(T("mob.confirm", { d: hm(sk.minutes) }))) act("skip_rest"); });
  $("aFull").addEventListener("click", () => { const fr = last && last.full_rest; if (fr && confirm(T("mob.confirm", { d: hm(fr.minutes) }))) act("full_rest"); });
  $("aWeek").addEventListener("click", () => { const fn = $("aWeek").dataset.fn || "weekly_rest"; const w = last && (fn === "red_rest" ? last.red_rest : last.wrest); if (w && confirm(T("mob.confirm", { d: hm(w.minutes) }))) act(fn); });

  // ---- döngü ----
  let fails = 0;
  async function poll() {
    try { const st = await api("/state"); fails = 0; $("offline").hidden = true; render(st); }
    catch (e) { fails++; if (fails >= 3) $("offline").hidden = false; }
  }
  (async () => { await loadStrings(); await poll(); setInterval(poll, 1000); })();
})();
</script>
</body>
</html>
